<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CA 로또 6/45</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#F2F0F5; --slip:#FFFFFF; --ink:#1E1B2E; --muted:#6B6680;
  --red:#D7263D; --red-soft:#FCE6E9; --line:#EBC9CF;
  --stage:#110F26; --stage-2:#1B1840; --stage-3:#2A2660; --stage-ink:#F4F2FF; --stage-muted:#A7A2CC;
  --gold:#FFC93C; --ok:#1F9D63;
  --b1:#FBC400; --b2:#69C8F2; --b3:#FF7272; --b4:#AAAAAA; --b5:#B0D840;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:24px 48px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:880px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;color:var(--red);letter-spacing:-.5px}
.brand h1 small{font-size:18px;color:var(--ink);margin-left:6px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}

/* slip */
.slip{background:var(--slip);border:1.5px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 16px);border-radius:6px 6px 0 0;opacity:.85}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--red)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:3/4;max-width:100%;border:1.5px solid var(--line);background:#fff;color:var(--red);border-radius:3px;font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .08s}
.cell:hover{background:var(--red-soft)}
.cell[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cell[aria-pressed=true]::after{content:"";position:absolute;inset:18% 30%;background:rgba(255,255,255,.12);border-radius:2px}
.cell:active{transform:scale(.94)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.count{font-family:var(--mono);color:var(--muted);font-size:13px;margin-left:auto}
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:4px;padding:9px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--ground)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#B81E33}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px}
.err{color:var(--red);font-size:13px;min-height:1em;margin:0}
.note{color:var(--muted);font-size:13px;margin:0}

/* balls */
.ball{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:calc(var(--s)*.46);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 8%,rgba(255,255,255,0) 30%),var(--c);box-shadow:inset -3px -4px 8px rgba(0,0,0,.18);flex:none;font-variant-numeric:tabular-nums}
.c1{--c:var(--b1)}.c2{--c:var(--b2)}.c3{--c:var(--b3)}.c4{--c:var(--b4)}.c5{--c:var(--b5)}
.balls{display:flex;gap:8px;flex-wrap:wrap}

.ticket{display:flex;flex-direction:column;gap:14px}
.ticket .who{font-family:var(--display);font-size:26px;line-height:1.1}
.codeline{font-family:var(--mono);font-size:14px;background:var(--ground);border:1.5px dashed var(--line);border-radius:4px;padding:12px;word-break:break-all;user-select:all}
.steps{margin:0;padding-left:20px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:4px}
footer{text-align:center}
footer a{color:var(--muted);font-size:12px}

/* host */
.panel{background:var(--slip);border:1.5px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:18px;display:flex;align-items:baseline;gap:8px}
.panel h2 .n{font-family:var(--mono);color:var(--red);font-size:15px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .nm{min-width:72px;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.prow .balls{gap:4px;flex-wrap:nowrap}
.prow .ball{--s:24px}
.prow .x{border:none;background:none;color:var(--muted);font-size:18px;padding:0 4px;line-height:1}
.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prizes label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.sum{font-family:var(--mono);font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}

/* stage */
.stage{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 0%,var(--stage-3),var(--stage) 60%);color:var(--stage-ink);z-index:10;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.stage-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stage-top h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold)}
.stage-top .sp{flex:1}
.sbtn{background:rgba(255,255,255,.08);color:var(--stage-ink);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:7px 12px;font-size:13px;font-weight:700}
.sbtn:hover{background:rgba(255,255,255,.16)}
.stage-main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:20px;flex:1;min-height:0}
@media (max-width:820px){.stage-main{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:14px;align-items:center}
.machine{width:100%;max-width:340px;aspect-ratio:4/5;position:relative}
.flyball{position:fixed;left:0;top:0;z-index:15;pointer-events:none;will-change:transform}
.flyball .ball{--s:120px;box-shadow:inset -8px -10px 18px rgba(0,0,0,.22),0 12px 30px rgba(0,0,0,.45)}
.flyball .num{display:inline-block}
.spot{position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,201,60,.18) 0,rgba(0,0,0,0) 180px);opacity:0;transition:opacity .3s}
.spot.on{opacity:1}
.machine canvas{width:100%;height:100%;display:block}
.caption{font-family:var(--display);font-size:22px;text-align:center;min-height:1.4em;color:var(--stage-ink)}
.caption.hot{color:var(--gold)}
.tray{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{--s:40px;width:var(--s);height:var(--s);border-radius:50%;border:2px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.slot .ball{--s:40px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.plus{font-family:var(--display);font-size:24px;color:var(--stage-muted)}
.bonus-lbl{font-size:11px;color:var(--stage-muted);text-align:center;letter-spacing:.08em}
.extras{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.extras .ball{--s:32px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;align-content:start}
.tk{background:var(--stage-2);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;transition:border-color .3s,background .3s}
.tk .hd{display:flex;align-items:center;gap:6px}
.tk .rk{font-family:var(--mono);font-size:12px;color:var(--stage-muted);width:22px}
.tk .nm{font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .hit{font-family:var(--display);font-size:16px;color:var(--stage-muted)}
.tk .nums{display:flex;gap:4px}
.tk .nn{flex:1;text-align:center;font-family:var(--mono);font-size:12px;padding:3px 0;border-radius:3px;background:rgba(255,255,255,.06);color:var(--stage-muted);transition:all .3s}
.tk .nn.on{background:var(--gold);color:var(--stage);font-weight:700}
.tk .nn.bo{background:#fff;color:var(--stage);font-weight:700}
.tk .nn.ex{background:#8C7CFF;color:#fff;font-weight:700}
.tk.lead{border-color:var(--gold);background:#27224F}
.tk.lead .hit{color:var(--gold)}
.tk.tied{border-color:#8C7CFF}

.podium{position:fixed;inset:0;z-index:20;background:rgba(10,8,28,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;color:var(--stage-ink);overflow:auto}
.podium h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--gold);text-align:center}
.pcards{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center;width:100%;max-width:760px}
.pc{flex:1 1 200px;max-width:240px;background:var(--stage-2);border:1.5px solid rgba(255,255,255,.15);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;opacity:.35;transition:opacity .4s,transform .4s}
.pc.show{opacity:1;transform:translateY(-6px)}
.pc.first{border-color:var(--gold);order:0}
.pc .pl{font-family:var(--display);font-size:22px}
.pc.first .pl{color:var(--gold);font-size:28px}
.pc .pn{font-family:var(--display);font-size:30px;line-height:1.1;min-height:1.1em;word-break:keep-all}
.pc .pm{font-size:13px;color:var(--stage-muted)}
.pc .pp{font-family:var(--mono);font-size:15px;color:var(--gold)}
.pc .balls{gap:3px;justify-content:center}
.pc .ball{--s:22px}
.drum{font-family:var(--display);font-size:22px;min-height:1.3em;color:var(--stage-muted)}
.res{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.06);border-radius:4px;padding:10px;max-width:520px;width:100%;color:var(--stage-ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.slot .ball,.extras .ball{animation:none}.tk,.pc{transition:none}}
.banner{border-radius:6px;padding:12px 14px;font-size:14px;background:var(--red-soft);color:var(--ink);border:1.5px solid var(--line)}
.banner.ok{background:#E4F4EC;border-color:#BFE3D0}
.result{display:flex;flex-direction:column;gap:12px}
.result .balls .ball{--s:36px}
.wl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.wl div{display:flex;gap:8px;align-items:baseline}
.wl b{color:var(--red);min-width:32px}
.mine{font-family:var(--display);font-size:22px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ground);color:var(--muted)}
.pill.open{background:#E4F4EC;color:var(--ok)}
.pill.closed{background:var(--red-soft);color:var(--red)}
.prow.dup .nm{color:var(--red)}
.prow .x.arm{color:var(--red);font-size:12px;font-weight:700}
.practice{background:#FFF4D6;border:1.5px solid #F2D27A;border-radius:6px;padding:10px 14px;font-size:14px}
</style>
</head>
<body>

<div id="participant" class="wrap">
  <div class="brand">
    <div>
      <div class="eyebrow">SW개발팀 CA 활동</div>
      <h1>CA 로또<small>6/45</small></h1>
    </div>
    <p>1~45 중 6개를 고르세요</p>
  </div>

  <div id="status" class="banner">연결 중이에요...</div>

  <form id="slip" class="slip" autocomplete="off">
    <label class="f" for="name">이름
      <input type="text" id="name" maxlength="12" placeholder="예: 김민지">
    </label>
    <div class="grid" id="grid" role="group" aria-label="번호 선택"></div>
    <div class="row">
      <button type="button" class="btn" id="auto">자동선택</button>
      <button type="button" class="btn ghost" id="reset">지우기</button>
      <span class="count" id="count">0 / 6</span>
    </div>
    <p class="err" id="err"></p>
    <button type="submit" class="btn primary big" id="confirm">번호 확정</button>
  </form>

  <div id="ticketView" class="slip ticket" hidden>
    <div class="eyebrow">접수 완료</div>
    <div class="who" id="tName"></div>
    <div class="balls" id="tBalls"></div>
    <p class="note">추첨은 팀즈 화면공유로 다 같이 봐요. 접수 마감 전까지는 번호를 바꿀 수 있어요.</p>
    <div class="row"><button type="button" class="btn" id="edit">번호 바꾸기</button></div>
  </div>

  <div id="resultView" class="slip result" hidden></div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyDWbQVRrplKMLJ-LaFDkJPTlT9blqIUljc",
  authDomain: "team-lookalike-vote.firebaseapp.com",
  databaseURL: "https://team-lookalike-vote-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "team-lookalike-vote",
  storageBucket: "team-lookalike-vote.firebasestorage.app",
  messagingSenderId: "341302976681",
  appId: "1:341302976681:web:6f9aaa519f74703b3b09b8"
};
</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const cls = n => 'c' + (n<=10?1:n<=20?2:n<=30?3:n<=40?4:5);
const pad = n => String(n).padStart(2,'0');
const ball = (n, size) => { const b=document.createElement('span'); b.className='ball '+cls(n); if(size) b.style.setProperty('--s', size+'px'); b.textContent=n; return b; };
const rnd = n => { const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
const shuffle45 = () => { const a=[...Array(45)].map((_,i)=>i+1); for(let i=44;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const won = n => Number(n||0).toLocaleString('ko-KR');
const cleanName = s => s.replace(/[\[\]:：\n\r]/g,'').trim().slice(0,12);

/* ---------- participant ---------- */
const picks = new Set();
const grid = $('#grid');
for (let i=1;i<=45;i++){
  const c=document.createElement('button');
  c.type='button'; c.className='cell'; c.textContent=i; c.dataset.n=i;
  c.setAttribute('aria-pressed','false'); c.setAttribute('aria-label', i+'번');
  grid.appendChild(c);
}
function paintGrid(){
  grid.querySelectorAll('.cell').forEach(c => c.setAttribute('aria-pressed', picks.has(+c.dataset.n)));
  $('#count').textContent = picks.size + ' / 6';
}
grid.addEventListener('click', e => {
  const c = e.target.closest('.cell'); if(!c) return;
  const n = +c.dataset.n;
  if (picks.has(n)) picks.delete(n);
  else if (picks.size < 6) picks.add(n);
  else { $('#err').textContent = '6개까지만 고를 수 있어요. 바꾸려면 하나를 먼저 해제하세요.'; return; }
  $('#err').textContent=''; paintGrid();
});
let autoBusy=false;
$('#auto').addEventListener('click', async () => {
  if (autoBusy) return; autoBusy=true;
  const pool = shuffle45().filter(n=>!picks.has(n));
  while (picks.size<6){ picks.add(pool.shift()); paintGrid(); await new Promise(r=>setTimeout(r,90)); }
  $('#err').textContent=''; autoBusy=false;
});
$('#reset').addEventListener('click', () => { picks.clear(); paintGrid(); $('#err').textContent=''; });

/* ---------- firebase ---------- */
const CFG = window.FIREBASE_CONFIG || {};
const fbOk = !!(CFG.databaseURL && window.firebase);
let db=null, uid=null, existing=null, state=null, editing=false;
const st = (text, ok) => { const s=$('#status'); s.hidden=!text; s.textContent=text||''; s.classList.toggle('ok',!!ok); };

function showTicket(t){
  $('#slip').hidden = true; $('#ticketView').hidden = false; editing=false;
  $('#tName').textContent = t.name;
  const tb=$('#tBalls'); tb.innerHTML=''; t.nums.forEach(n=>tb.appendChild(ball(n,44)));
  render();
}
function showForm(){
  if (existing){ $('#name').value=existing.name; picks.clear(); existing.nums.forEach(n=>picks.add(n)); paintGrid(); }
  $('#ticketView').hidden=true; $('#slip').hidden=false; editing=true; render();
}
function render(){
  const open = !!(state && state.open);
  const res = state && state.result;
  $('#confirm').disabled = !open || !uid;
  $('#edit').hidden = !open;
  if (!fbOk) st('아직 설정이 안 된 페이지예요. 진행자에게 알려 주세요.');
  else if (!uid) st('연결 중이에요...');
  else if (res) st('');
  else if (!state || (!state.open && !state.everOpened)) st('아직 접수가 시작되지 않았어요. 조금만 기다려 주세요.');
  else if (!open) st(existing ? '접수가 마감됐어요. 추첨을 기다려 주세요!' : '접수가 마감됐어요.');
  else st(existing ? '' : '접수 중이에요. 이름과 번호 6개를 골라 확정하세요.', true);
  // after the draw, lock the form
  if (res || (!open && state)){ if (existing){ $('#slip').hidden=true; $('#ticketView').hidden=false; } }
  renderResult(res);
}
function renderResult(res){
  const R=$('#resultView');
  if (!res){ R.hidden=true; return; }
  R.hidden=false; R.innerHTML='';
  const eb=document.createElement('div'); eb.className='eyebrow'; eb.textContent='추첨 결과';
  const bs=document.createElement('div'); bs.className='balls';
  Object.values(res.main||{}).sort((a,b)=>a-b).forEach(n=>bs.appendChild(ball(n)));
  const plus=document.createElement('span'); plus.textContent='+'; plus.style.cssText='font-family:var(--display);font-size:22px;color:var(--muted);align-self:center';
  bs.appendChild(plus); if (res.bonus) bs.appendChild(ball(res.bonus));
  const wl=document.createElement('div'); wl.className='wl';
  Object.values(res.winners||{}).forEach(w=>{ const d=document.createElement('div'); const b=document.createElement('b'); b.textContent=w.rank+'등'; const s=document.createElement('span'); s.textContent=`${w.name} · ${w.main}개 일치${w.bonus?' + 보너스':''}`; d.append(b,s); wl.appendChild(d); });
  R.append(eb,bs,wl);
  const me = res.ranks && uid && res.ranks[uid];
  if (me){
    const m=document.createElement('div'); m.className='mine';
    m.textContent = me.rank<=3 ? `축하해요! ${me.rank}등이에요` : `내 결과: ${me.main}개 일치${me.bonus?' + 보너스':''} · ${res.total}명 중 ${me.rank}등`;
    R.appendChild(m);
  }
}

$('#slip').addEventListener('submit', async e => {
  e.preventDefault();
  const name = cleanName($('#name').value);
  if (!name){ $('#err').textContent='이름을 입력해 주세요.'; $('#name').focus(); return; }
  if (picks.size!==6){ $('#err').textContent=`번호를 6개 골라 주세요. 지금 ${picks.size}개예요.`; return; }
  if (!uid){ $('#err').textContent='아직 연결 중이에요. 잠시 후 다시 눌러 주세요.'; return; }
  if (!state || !state.open){ $('#err').textContent='지금은 접수 기간이 아니에요.'; return; }
  const nums=[...picks].sort((a,b)=>a-b);
  const btn=$('#confirm'); btn.disabled=true; btn.textContent='저장 중...';
  const TS=firebase.database.ServerValue.TIMESTAMP;
  const data={ name, nums, updatedAt: TS };
  if (!existing) data.createdAt = TS;
  try{
    await db.ref('lotto/tickets/'+uid).update(data);
    existing = { name, nums };
    $('#err').textContent='';
    showTicket(existing);
  }catch(ex){
    $('#err').textContent = ex && /permission/i.test(String(ex.code||ex.message)) ? '접수가 마감돼서 저장하지 못했어요.' : '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  }finally{ btn.textContent='번호 확정'; render(); }
});
$('#edit').addEventListener('click', showForm);

if (fbOk){
  firebase.initializeApp(CFG); db=firebase.database();
  let id=null; try{ id=localStorage.getItem('ca-lotto-id'); }catch(e){}
  if (!id || !/^[a-z0-9]{12,}$/.test(id)){ id=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,20); try{ localStorage.setItem('ca-lotto-id', id); }catch(e){} }
  uid=id;
  (async () => {
    // my own ticket, live: if the host resets, the form comes back
    db.ref('lotto/tickets/'+uid).on('value', d => {
      const x=d.val();
      if (x && x.name && x.nums){ existing={name:x.name, nums:Object.values(x.nums)}; if (!editing) showTicket(existing); }
      else if (existing){ existing=null; picks.clear(); paintGrid(); $('#name').value=''; $('#ticketView').hidden=true; $('#slip').hidden=false; render(); }
    }, () => {});
    db.ref('lotto/state').on('value', s => { state = s.val(); render(); }, () => st('연결이 끊겼어요. 새로고침해 주세요.'));
    render();
  })();
}
paintGrid(); render();
})();
</script>
